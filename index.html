<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Northline Conversational AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout from Figma "Table" (1828:12487): 200px product nav | 200px chat history | thread + composer, 550px column. */
:root {
  --bg: #F9FAFB; --surface: #FFFFFF; --surface-2: #F2F4F7; --line: #E4E7EC; --line-2: #F2F4F7; --line-strong: #D0D5DD;
  --fg: #1D2939; --fg-2: #475467; --fg-3: #667085; --fg-4: #98A2B3;
  --accent: #7F56D9; --accent-strong: #6941C6; --accent-soft: #F4EBFF; --accent-line: #E9D7FE; --accent-mid: #9E77ED;
  --bubble: #E4E7EC; --send-off: #D0D5DD; --spark: #FEC84B;
  --nav: #101828; --nav-2: #1D2939; --nav-3: #344054; --nav-fg: #D0D5DD; --nav-hi: #FFFFFF; --nav-on-fg: #E9D7FE;
  --bad: #D92D20; --bad-soft: #FEF3F2; --note: #FFFAEB; --note-line: #FEC84B; --note-fg: #7A2E0E;
  --code-bg: #F9FAFB; --k: #6941C6; --s: #067647; --c: #98A2B3;
  --shadow-sm: 0 4px 8px -2px rgba(16,24,40,.10), 0 2px 4px -2px rgba(16,24,40,.06);
  --tab-shadow: 0 4px 4px rgba(0,0,0,.12);
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --col: 550px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C111D; --surface: #161B26; --surface-2: #1F242F; --line: #2A303C; --line-2: #222833; --line-strong: #333A47;
  --fg: #F5F5F6; --fg-2: #CECFD2; --fg-3: #94969C; --fg-4: #6B6F78;
  --accent: #9E77ED; --accent-strong: #B692F6; --accent-soft: #2C1C5F; --accent-line: #53389E; --accent-mid: #9E77ED;
  --bubble: #2A303C; --send-off: #333A47; --spark: #FDB022;
  --nav: #0A0D14; --nav-2: #161B26; --nav-3: #2A303C;
  --bad: #F97066; --bad-soft: #3E1A17; --note: #2B2210; --note-line: #B54708; --note-fg: #FEDF89;
  --code-bg: #0C111D; --k: #B692F6; --s: #47CD89; --c: #6B6F78;
  --shadow-sm: 0 4px 8px -2px rgba(0,0,0,.4), 0 2px 4px -2px rgba(0,0,0,.3); --tab-shadow: 0 2px 4px rgba(0,0,0,.4);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0C111D; --surface: #161B26; --surface-2: #1F242F; --line: #2A303C; --line-2: #222833; --line-strong: #333A47;
  --fg: #F5F5F6; --fg-2: #CECFD2; --fg-3: #94969C; --fg-4: #6B6F78;
  --accent: #9E77ED; --accent-strong: #B692F6; --accent-soft: #2C1C5F; --accent-line: #53389E; --accent-mid: #9E77ED;
  --bubble: #2A303C; --send-off: #333A47; --spark: #FDB022;
  --nav: #0A0D14; --nav-2: #161B26; --nav-3: #2A303C;
  --bad: #F97066; --bad-soft: #3E1A17; --note: #2B2210; --note-line: #B54708; --note-fg: #FEDF89;
  --code-bg: #0C111D; --k: #B692F6; --s: #47CD89; --c: #6B6F78;
  --shadow-sm: 0 4px 8px -2px rgba(0,0,0,.4), 0 2px 4px -2px rgba(0,0,0,.3); --tab-shadow: 0 2px 4px rgba(0,0,0,.4);
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 12px; line-height: 1.2; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { flex: none; display: block; }
.flip { transform: rotate(180deg); }
.muted { color: var(--fg-3); }
.spacer { flex: 1; }
.app { display: flex; height: 100%; min-height: 0; }

/* ---------- product nav (Sidebar - Main) ---------- */
.nav { width: 200px; flex: none; background: var(--nav); color: var(--nav-fg); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; overflow-y: auto; border-right: 1px solid var(--nav-3); }
.nav-top, .nav-foot { display: flex; flex-direction: column; gap: 16px; }
.brand { height: 24px; display: flex; align-items: center; color: var(--nav-hi); margin-bottom: -8px; }
.brand.sm { height: auto; margin: 0; color: var(--fg); }
.logo { display: block; }
.ws { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 4px; background: var(--nav-2); text-align: left; }
.ws-av { width: 32px; height: 32px; flex: none; border-radius: 4px; background: var(--nav-3); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #E4E7EC; }
.ws-name { color: var(--nav-hi); font-size: 14px; font-weight: 500; line-height: 1.4; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-list a { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: 8px; color: var(--nav-fg); text-decoration: none; font-size: 12px; white-space: nowrap; }
.nav-list a:hover { background: var(--nav-2); color: var(--nav-hi); }
.nav-list a.on { background: #6941C6; color: var(--nav-on-fg); font-weight: 600; }
.nav-sep { height: 1px; background: var(--nav-3); }
.nav-group { display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 10px; font-weight: 600; color: var(--nav-fg); margin-bottom: -12px; }
.trial { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--nav-2); color: var(--nav-hi); text-decoration: none; font-size: 12px; line-height: 1.4; }
.trial span { flex: 1; }

/* ---------- header ---------- */
.work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 58px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.seg, .tabs { display: inline-flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 8px; }
.seg button, .tabs button { padding: 6px 10px; border-radius: 6px; color: var(--fg-2); font-size: 12px; line-height: 1.2; white-space: nowrap; }
.seg button.on, .tabs button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--tab-shadow); }
.mobile-brand { display: none; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--fg-2); cursor: pointer; user-select: none; white-space: nowrap; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; transition: background .2s; flex: none; }
.knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.2); transition: transform .2s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track .knob { transform: translateX(12px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- chat history ---------- */
.body { flex: 1; min-height: 0; display: flex; }
.history { width: 200px; flex: none; box-sizing: border-box; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
.new-chat { margin: 12px; width: calc(100% - 24px); height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: #344054; font-size: 14px; font-weight: 600; }
.new-chat:hover { border-color: var(--accent-mid); color: var(--accent-strong); }
.h-groups { padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; }
.h-group { display: flex; flex-direction: column; gap: 8px; padding: 0 12px; }
.h-group + .h-group { margin-top: 16px; }
.history > .h-group:first-of-type { margin-top: 16px; }
.h-label { font-size: 10px; color: var(--fg-4); padding: 0 8px; }
.h-list { display: flex; flex-direction: column; }
.h-item { text-align: left; padding: 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); font-size: 12px; margin-bottom: -2px; }
.h-item:hover { background: var(--surface-2); }
.h-item.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; }
.h-empty { color: var(--fg-3); padding: 0 8px; margin: 0; font-size: 12px; line-height: 1.4; }

/* ---------- thread ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.thread { flex: 1; overflow-y: auto; padding: 32px 24px 16px; }
.thread-in { max-width: var(--col); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-height: 100%; justify-content: flex-end; }

.u-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.bubble { background: var(--bubble); padding: 12px 16px; border-radius: 12px 12px 2px 12px; max-width: 500px; font-size: 12px; line-height: 1.2; color: var(--fg); }
.edit-btn { opacity: 0; transition: opacity .15s; }
.u-row:hover .edit-btn, .edit-btn:focus-visible { opacity: 1; }
.bubble.editing { width: min(420px, 100%); display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--accent-line); }
.bubble textarea { font: inherit; letter-spacing: inherit; border: 0; resize: none; background: transparent; color: var(--fg); outline: none; }
.edit-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* buttons (Figma: 24px tall, 4px radius, 10px semibold) */
.icon-btn { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; color: var(--fg-3); }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--fg); }
.icon-btn.flagged { color: var(--bad); background: var(--bad-soft); }
.ghost-btn { display: inline-flex; align-items: center; gap: 4px; height: 24px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; font-weight: 600; font-size: 10px; background: var(--surface); color: var(--fg-2); white-space: nowrap; }
.ghost-btn:hover { color: var(--fg); border-color: var(--line-strong); }
.ghost-btn.active { color: var(--accent-strong); border-color: var(--accent-line); background: var(--accent-soft); }
.topbar .ghost-btn { height: 30px; font-size: 12px; gap: 6px; }
.primary-btn { height: 24px; padding: 0 12px; border-radius: 4px; background: var(--accent); color: #fff; font-weight: 600; font-size: 10px; }
.link { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 2px; }

/* answer card */
.ans-wrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 12px 2px; padding: 16px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.card.soft { gap: 16px; }
.ans-head { display: flex; flex-direction: column; gap: 4px; }
.ans-head h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }
.thought { display: flex; align-items: center; gap: 4px; color: var(--fg-3); font-size: 10px; }
.spark { color: var(--spark); }
.ans-body { display: flex; flex-direction: column; gap: 8px; margin-top: -8px; }
.lead { margin: 0; font-size: 12px; line-height: 1.45; max-width: 68ch; }
.bullets { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.caret { display: inline-block; width: 6px; height: 12px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.reveal { display: flex; flex-direction: column; gap: 16px; animation: rise .35s ease-out; min-width: 0; }
@keyframes rise { from { opacity: .3; transform: translateY(4px); } }
.seg-row { display: flex; }

/* table */
.tbl-wrap { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; min-width: 0; margin-bottom: -8px; }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 10px; }
.tbl th { text-align: left; font-weight: 600; padding: 8px; background: var(--bg); border-bottom: 1px solid var(--line-2); white-space: nowrap; color: var(--fg); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; background: var(--surface); }
.tbl .num { text-align: right; }
.tbl td.primary { font-weight: 600; }
.tbl td.bad { color: var(--bad); font-weight: 600; }
.pill { display: inline-block; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 99px; margin-left: 4px; vertical-align: 1px; }
.bad-pill { background: var(--bad-soft); color: var(--bad); }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 4px; height: 28px; padding: 0 8px; font-size: 10px; font-weight: 600; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.pager .icon-btn { width: 16px; height: 16px; }

/* chart */
.chart { border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: -8px; }
.chart-head { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
.bar-row { display: grid; grid-template-columns: minmax(70px, 150px) 1fr 64px; gap: 8px; align-items: center; font-size: 10px; }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.bar-track { height: 16px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar { height: 100%; background: var(--accent-line); border-radius: 3px; transform-origin: left; animation: grow .5s cubic-bezier(.2,.7,.2,1) backwards; }
.bar-lead { background: var(--accent); }
.bar-bad { background: var(--bad); }
@keyframes grow { from { transform: scaleX(0); } }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* sql */
.sql { position: relative; border: 1px solid var(--line); border-radius: 4px; background: var(--code-bg); margin-bottom: -8px; }
.sql pre { margin: 0; padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--fg); letter-spacing: 0; }
.sql .k { color: var(--k); font-weight: 500; } .sql .s { color: var(--s); } .sql .c { color: var(--c); font-style: italic; }
.sql-copy { position: absolute; top: 8px; right: 8px; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.actions .icon-btn { width: 20px; height: 20px; }
.how { border: 1px dashed var(--line-strong); border-radius: 4px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
.how-grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 16px; }
.how p, .how ul { margin: 6px 0 0; color: var(--fg-2); font-size: 11px; line-height: 1.4; }
.how p { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.how ul { padding-left: 16px; }
.how li + li { margin-top: 4px; }
.eyebrow { font-size: 10px; font-weight: 600; color: var(--fg-3); }

.related { display: flex; flex-direction: column; gap: 8px; }
.related-h { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 10px; margin-bottom: 4px; }
.related-q { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10px; font-weight: 600; color: var(--fg-2); }
.related-q .ic { color: var(--fg-4); transition: transform .15s; opacity: 0; }
.related-q:hover { color: var(--accent-strong); }
.related-q:hover .ic { transform: translateX(2px); color: var(--accent); opacity: 1; }
.reroll { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 10px; color: var(--fg-2); margin-top: 4px; }
.reroll:hover { color: var(--accent-strong); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 10px; color: var(--fg-2); }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.flag-meta { color: var(--bad); font-weight: 600; }

/* thinking */
.thinking { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--fg-2); font-weight: 500; padding: 4px 0; }
.matrix { flex: none; display: block; overflow: visible; }
.mx-off { fill: var(--line); }
.mx-on { fill: var(--accent); transition: opacity 80ms linear; filter: drop-shadow(0 0 1.5px var(--accent-line)); }
.shimmer { background: linear-gradient(90deg, var(--fg-3) 0%, var(--fg) 50%, var(--fg-3) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.6s linear infinite; }
@keyframes shim { to { background-position: -200% 0; } }

/* clarify / empty / unknown */
.soft-head { display: flex; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 16px; }
.badge.accent { background: var(--accent-soft); color: var(--accent-strong); }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.choice strong { font-size: 12px; font-weight: 600; }
.choice span { font-size: 10px; color: var(--fg-3); }
.choice:hover:not(:disabled) { border-color: var(--accent-mid); background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 5px 10px; border-radius: 16px; border: 1px solid var(--accent-line); color: var(--accent-strong); background: var(--accent-soft); font-weight: 600; font-size: 10px; text-align: left; }
.chip:hover { border-color: var(--accent-mid); }
.chip.quiet { background: var(--surface); border-color: var(--line); color: var(--fg-2); }
.try-h { font-size: 10px; font-weight: 600; color: var(--fg-3); margin-bottom: -8px; }
.empty { flex-direction: row; align-items: flex-start; gap: 12px; }
.empty-ic { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); color: var(--fg-3); display: grid; place-items: center; flex: none; }
.empty-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; flex: 1; }
.why { margin: -4px 0 0; color: var(--fg-2); font-size: 12px; line-height: 1.45; }

/* welcome */
.welcome { padding: 24px 0 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: auto; }
.welcome-ic { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.welcome h2 { margin: 8px 0 0; font-size: 18px; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance; }
.welcome p { margin: 0; font-size: 12px; line-height: 1.45; }
.starters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 12px; }
.starter { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12px; font-weight: 500; line-height: 1.3; }
.starter:hover { border-color: var(--accent-mid); background: var(--accent-soft); }
.starter .ic { color: var(--fg-4); }

/* composer (Input box) */
.composer-wrap { padding: 16px 24px 16px; display: flex; flex-direction: column; gap: 16px; max-width: calc(var(--col) + 48px); width: 100%; box-sizing: border-box; margin: 0 auto; }
.composer { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px; }
.composer:focus-within { border-color: var(--accent-mid); box-shadow: var(--shadow-sm), 0 0 0 4px var(--accent-soft); }
.composer textarea { font: inherit; letter-spacing: inherit; font-size: 12px; line-height: 1.5; height: 36px; border: 0; outline: none; resize: none; background: transparent; color: var(--fg); padding: 0; }
.composer textarea::placeholder { color: var(--fg-4); }
.composer-row { display: flex; align-items: center; gap: 16px; }

/* designer's notes */

/* data modal */
.scrim { position: fixed; inset: 0; background: rgba(16,24,40,.5); display: grid; place-items: center; padding: 24px 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 12px; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.modal-h { display: flex; justify-content: space-between; gap: 16px; padding: 16px; border-bottom: 1px solid var(--line); }

.modal-body { overflow: auto; }
.tbl.dense th { position: sticky; top: 0; font-family: var(--mono); font-weight: 500; letter-spacing: 0; }

.show-sm { display: none !important; }

}

/* ---------- how I got this: semantic query chips ---------- */
.main .how { gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-style: solid; }
.how-sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.how-sec ul { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 14px; line-height: 1.5; }
.how-sec li + li { margin-top: 4px; }
.qchips-box { display: flex; flex-direction: column; gap: 10px; }
.qsentence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; line-height: 1; }
.qwrap { position: relative; display: inline-flex; align-items: center; gap: 6px; }
.qword { color: var(--fg-3); font-size: 13px; }
.qchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: border-color .12s, background .12s; }
.qchip:hover { border-color: var(--line-strong); background: var(--surface); }
.qchip.open { border-color: var(--accent-mid); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.qchip .ic { color: var(--fg-4); }
.qchip.metric { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-strong); font-weight: 600; }
.qchip.metric .ic { color: var(--accent); }
.qchip.changed { border-color: var(--accent); background: var(--surface); color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--accent); }
.qchip.locked { background: transparent; border-style: dashed; color: var(--fg-2); }
.qchip.add { border-style: dashed; background: transparent; color: var(--fg-3); padding: 0 10px 0 8px; }
.qchip.add:hover { color: var(--accent-strong); border-color: var(--accent-mid); }
.qis { color: var(--fg-3); font-weight: 400; }
.seal { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.seal .ic { color: #fff !important; }
.qx { display: grid; place-items: center; width: 18px; height: 18px; margin-left: -2px; border-radius: 4px; color: var(--fg-3); cursor: pointer; }
.qx:hover { background: var(--line); color: var(--fg); }
.qhint { margin: 0; font-size: 13px; color: var(--fg-3); line-height: 1.45; }
.qbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent-line); animation: rise .2s ease-out; }
.qbar-text { font-size: 13px; color: var(--fg-2); line-height: 1.4; min-width: 0; }
.qbar-text strong { color: var(--accent-strong); margin-right: 4px; }
.main .qbar .primary-btn { display: inline-flex; align-items: center; gap: 6px; }

/* popover */
.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 15; width: 240px; max-width: calc(100vw - 48px); max-height: 340px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px -8px rgba(16,24,40,.22), 0 2px 6px rgba(16,24,40,.06); padding: 6px; display: flex; flex-direction: column; gap: 2px; line-height: 1.4; white-space: normal; animation: rise .14s ease-out; text-align: left; }
.pop.wide { width: 320px; }
.pop-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); padding: 8px 8px 4px; }
.pop-note { margin: 0; padding: 4px 8px 8px; font-size: 13px; color: var(--fg-2); }

.opt-list { display: flex; flex-direction: column; gap: 2px; }

/* metric definition card */
.def { display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 10px; border-bottom: 1px solid var(--line-2); margin-bottom: 2px; }

.cert, .uncert { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.cert { background: #ECFDF3; color: #067647; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cert { background: #053321; color: #75E0A7; } :root:not([data-theme="light"]) .uncert { background: #4E1D09; color: #FEC84B; } }

.sql-link { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 13px; font-weight: 500; color: var(--fg-2); padding-top: 12px; border-top: 1px solid var(--line-2); width: 100%; }
.sql-link:hover { color: var(--accent-strong); }
.edited { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 6px; font-size: 12.5px; color: var(--accent-strong); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 99px; padding: 3px 10px; }
@media (max-width: 560px) { .pop, .pop.wide { width: min(300px, calc(100vw - 48px)); } }

/* ---------- design decision hotspots ---------- */
.hs { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-left: 8px; vertical-align: middle; flex: none; }
.hs-dot { position: relative; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.hs-dot::before { content: ""; position: relative; z-index: 1; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); transition: box-shadow .15s; }
.hs-dot::after { content: ""; position: absolute; left: 5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0; animation: hs-ripple 2.2s ease-out infinite; }
@keyframes hs-ripple { 0% { transform: scale(1); opacity: .5; } 80%, 100% { transform: scale(3); opacity: 0; } }
.hs-dot:hover::before, .hs-dot.open::before { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px var(--accent-line); }
.hs-dot.open::after { animation: none; }
.hs-tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); padding: 5px 8px; border-radius: 6px; background: var(--fg); color: var(--surface); font-size: 12px; font-weight: 500; line-height: 1.2; letter-spacing: normal; text-transform: none; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 31; }
.hs-dot:hover .hs-tip, .hs-dot:focus-visible .hs-tip { opacity: 1; }
.hs-dot.open .hs-tip { display: none; }
.hs-pop { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 30; width: 300px; max-width: calc(100vw - 32px); box-sizing: border-box;
  display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; text-align: left; cursor: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px -12px rgba(16,24,40,.28), 0 2px 6px rgba(16,24,40,.06);
  font-size: 13.5px; font-weight: 400; line-height: 1.5; letter-spacing: normal; text-transform: none; color: var(--fg); white-space: normal; animation: rise .16s ease-out; }
.hs-pop.up { top: auto; bottom: calc(100% + 8px); }
.hs-pop-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    return "$" + Math.round(v).toLocaleString();
  }
  if (kind === "pct") return (v * 100).toFixed(1) + "%";
  if (kind === "weeks") return v >= 99 ? "—" : v.toFixed(1) + " wks";
  return Math.round(v).toLocaleString();
}

function parse(q, data, prev) {
  const s = " " + q.toLowerCase().replace(/[?.!,]/g, " ") + " ";
  const p = { filters: {}, metric: null, dim: null, top: null, intent: null, raw: q };

  // filters
  const fuels = [];
  let rest = s;
  for (const f of FUELS) { if (f.re.test(rest)) { fuels.push(f.key); rest = rest.replace(f.re, " "); } }
  if (fuels.length) p.filters.fuel_type = fuels;
  const regs = REGIONS.filter(r => new RegExp("\\b" + r.toLowerCase() + "(ern)?\\b").test(s));
  if (regs.length) p.filters.region = regs;
  const makes = [...new Set(data.map(d => d.make))].filter(m => s.includes(" " + m.toLowerCase()));
  if (makes.length) p.filters.make = makes;
  const models = [...new Set(data.map(d => d.model))].filter(m => s.includes(m.toLowerCase()));
  if (models.length) p.filters.model = models;
  const colors = [...new Set(data.map(d => d.color))].filter(c => s.includes(c.toLowerCase()));
  if (colors.length) p.filters.color = colors;
  const basicColors = ["white","black","red","blue","gray","grey","silver","green","gold"].filter(c => new RegExp("\\b" + c + "\\b").test(s));

  // metric
  if (/\bmargins?\b/.test(s)) p.metric = "margin";
  else if (/\b(profit|profitable|earn)/.test(s)) p.metric = "profit";
  else if (/\b(in stock|inventory|stock levels?|on hand)\b/.test(s)) p.metric = "stock";
  else if (/\b(units?|volume|how many|quantity|sold|sells?|selling|sellers?)\b/.test(s)) p.metric = "units";
  else if (/\b(revenue|sales|turnover|money)\b/.test(s)) p.metric = "revenue";
  else if (/\b(price|cost|expensive|cheap)/.test(s)) p.metric = "price";

  // dimension: "by X", "across X", "per X", "each X", "which X"
  const dimMatches = DIMS.filter(d => d.re.test(s));
  const explicit = DIMS.find(d => new RegExp("\\b(by|across|per|each|every|which|what|between|different|compare)\\s+(\\w+\\s+)?" + d.re.source.replace(/\\b/g, "")).test(s));
  p.dim = (explicit || dimMatches[0] || {}).key || null;
  if (p.dim === "model" && /\bvariants?\b/.test(s)) p.dim = "variant";
  if (!p.dim && basicColors.length && /\bcolou?r|white|black|red|blue/.test(s) && !p.filters.color) p.dim = "color";

  const top = s.match(/\btop\s+(\d+)\b/);
  if (top) p.top = +top[1];
  else if (/\b(top|best|highest|most|leading)\b/.test(s) && p.dim && p.dim !== "region" && p.dim !== "fuel_type") p.top = 5;

  // intents
  if (/\b(low stock|running (low|out)|stock ?out|restock|reorder|sell out|selling out|weeks of cover|shortage)\b/.test(s)) p.intent = "lowstock";

  const vague = /\b(best|doing well|performing|performance|good|winners?|top performers?|how are we doing|how.?s it going)\b/.test(s);
  const isFollowUp = prev && /^\s*(and|what about|how about|now|only|just|same|then|filter|split|break|show (that|it|this))\b/.test(q.toLowerCase());

  if (isFollowUp && !p.intent) {
    p.followUp = true;
    p.metric = p.metric || prev.metric;
    p.dim = p.dim || prev.dim;
    p.filters = Object.assign({}, prev.filters, p.filters);
    if (/\b(all|every|remove filter|clear)\b/.test(s)) p.filters = {};
  }

  if (p.dim && p.filters[p.dim] && p.filters[p.dim].length === 1 && !explicit) { /* keep */ }
  else if (p.dim && p.filters[p.dim] && p.followUp) delete p.filters[p.dim];

  if (!p.intent) {
    const recognized = p.metric || p.dim || Object.keys(p.filters).length;
    if (vague && !p.metric) p.intent = "clarify";
    else if (!recognized) p.intent = "unknown";
    else {
      p.intent = "aggregate";
      if (!p.metric) p.metric = "revenue";
      if (!p.dim) p.dim = p.filters.region ? "model" : "region";
    }
  }
  return p;
}

function applyFilters(data, filters) {
  return data.filter(r => Object.entries(filters).every(([k, vals]) => vals.includes(r[k])));
}

function sqlWhere(filters) {
  const parts = Object.entries(filters).map(([k, v]) =>
    v.length === 1 ? `${k} = '${v[0]}'` : `${k} IN (${v.map(x => `'${x}'`).join(", ")})`);
  return parts.length ? "\nWHERE " + parts.join("\n  AND ") : "";
}

function describeFilters(filters, noRegion) {
  const bits = [];
  if (filters.color) bits.push(filters.color.join(" / "));
  if (filters.fuel_type) bits.push(filters.fuel_type.map(f => f === "Electric" ? "electric" : f.toLowerCase()).join(" and "));
  if (filters.make) bits.push(filters.make.join(" and "));
  if (filters.model) bits.push(filters.model.join(" and "));
  let txt = bits.join(" ");
  if (filters.region && !noRegion) txt += (txt ? " " : "") + "in the " + filters.region.join(" and ");
  return txt;
}

function run(q, data, prev) {
  return execute(parse(q, data, prev), data);
}

/* Run a structured (semantic) query directly: used by the parser and by edited query chips. */
function execute(p, data) {
  const q = p.raw || "";
  const t0 = performance.now ? performance.now() : 0;

  if (p.intent === "clarify") {
    return { kind: "clarify", parsed: p,
      text: "“Best” can mean a few different things here. Which one do you want me to rank by?",
      options: [
        { label: "Revenue", hint: "Selling price × units sold", q: rewrite(q, "revenue") },
        { label: "Units sold", hint: "Raw volume, ignores price", q: rewrite(q, "units sold") },
        { label: "Gross margin", hint: "Profit as a share of revenue", q: rewrite(q, "gross margin") },
      ] };
  }
  if (p.intent === "unknown") {
    return { kind: "unknown", parsed: p,
      text: "I couldn't map that to the cars table. I can answer questions about revenue, units sold, profit, margin, stock and price, broken down by region, make, model, variant, fuel type or color.",
      options: STARTERS.slice(0, 3).map(x => ({ label: x, q: x })) };
  }

  if (p.intent === "lowstock") {
    const rows = applyFilters(data, p.filters)
      .map(r => ({ ...r, cover: r.quantity_sold ? r.quantity_in_stock / (r.quantity_sold / 13) : 99 }))
      .sort((a, b) => a.cover - b.cover).slice(0, p.top || 8);
    const sql = `-- Compiled by the Northline Sales semantic layer
-- weeks_of_cover = units in stock ÷ average weekly units sold (13 weeks)
SELECT make, model, variant, color, region,
       quantity_in_stock,
       quantity_sold,
       ROUND(quantity_in_stock / (quantity_sold / 13.0), 1) AS weeks_of_cover
FROM cars${sqlWhere(p.filters)}
ORDER BY weeks_of_cover ASC
LIMIT ${p.top || 8};`;
    const critical = rows.filter(r => r.cover < 2);
    const lead = critical.length
      ? `${critical.length} vehicle${critical.length > 1 ? "s have" : " has"} less than two weeks of stock left. The tightest is the ${rows[0].make} ${rows[0].model} ${rows[0].variant} in ${rows[0].color} (${rows[0].region}), with ${rows[0].quantity_in_stock} units on hand against ${rows[0].quantity_sold} sold this quarter.`
      : `Nothing is critically low. The tightest is the ${rows[0].make} ${rows[0].model} at ${fmt(rows[0].cover, "weeks")} of cover.`;
    return {
      kind: "answer", parsed: p, title: "Cars at risk of selling out", sql, lead,
      bullets: rows.slice(0, 4).map(r => `${r.model} ${r.variant}, ${r.color} (${r.region}): ${fmt(r.cover, "weeks")}`),
      columns: [
        { key: "label", label: "Vehicle" }, { key: "region", label: "Region" },
        { key: "quantity_in_stock", label: "In stock", num: true, fmt: "int" },
        { key: "quantity_sold", label: "Sold (Q3)", num: true, fmt: "int" },
        { key: "cover", label: "Weeks of cover", num: true, fmt: "weeks", flag: v => v < 2 },
      ],
      rows: rows.map(r => ({ ...r, label: `${r.make} ${r.model} ${r.variant} · ${r.color}` })),
      chart: { key: "cover", fmt: "weeks", label: "Weeks of cover", lowIsBad: true },
      assumptions: ["Anything under 2 weeks of cover is flagged as critical."],
      related: [
        "Compare sales of electric variants across different regions",
        "What's the gross margin by model for electric cars?",
        "Which colors sell best in the West?",
      ],
      ms: Math.round((performance.now ? performance.now() : 0) - t0),
    };
  }

  // aggregate
  const filtered = applyFilters(data, p.filters);
  const scope = describeFilters(p.filters);
  if (!filtered.length) {
    return { kind: "empty", parsed: p,
      text: `I didn't find any ${describeFilters(p.filters, true) || "matching"} cars${p.filters.region ? " in the " + p.filters.region.join(" or ") : ""}, so there's nothing to show.`,
      why: noDataReason(p.filters, data),
      sql: buildSql(p),
      options: emptyAlternatives(p) };
  }
  const groups = {};
  for (const r of filtered) {
    const k = r[p.dim];
    const g = groups[k] || (groups[k] = { key: k, revenue: 0, units: 0, profit: 0, stock: 0, priceSum: 0, n: 0 });
    g.revenue += r.selling_price * r.quantity_sold;
    g.units += r.quantity_sold;
    g.profit += (r.selling_price - r.manufacturing_price) * r.quantity_sold;
    g.stock += r.quantity_in_stock;
    g.priceSum += r.selling_price; g.n++;
  }
  let rows = Object.values(groups).map(g => ({ ...g, margin: g.profit / g.revenue, price: g.priceSum / g.n }));
  rows.sort((a, b) => b[p.metric] - a[p.metric]);
  const totalGroups = rows.length;
  if (p.top) rows = rows.slice(0, p.top);

  const m = METRICS[p.metric];
  const dimLabel = DIMS.find(d => d.key === p.dim).label;
  const total = rows.reduce((a, r) => a + r[p.metric], 0);
  const lead0 = rows[0];
  let lead;
  if (rows.length === 1) {
    lead = `${scope ? capital(scope) + ": " : ""}${m.label.toLowerCase()} is ${fmt(lead0[p.metric], m.fmt)} for ${lead0.key}.`;
  } else if (["revenue", "units", "profit", "stock"].includes(p.metric)) {
    const share = lead0[p.metric] / rows.reduce((a, r) => a + r[p.metric], 0);
    const last = rows[rows.length - 1];
    const noun = describeFilters(p.filters, true);
    const ratio = lead0[p.metric] / Math.max(last[p.metric], 1);
    lead = `${lead0.key} leads with ${fmt(lead0[p.metric], m.fmt)}, ${Math.round(share * 100)}% of ${noun ? noun + " " : ""}${m.label.toLowerCase()}${p.filters.region ? " in the " + p.filters.region.join(" and ") : ""}${p.top && totalGroups > rows.length ? " among the top " + rows.length : ""}. ${last.key} is lowest at ${fmt(last[p.metric], m.fmt)}${ratio >= 3 ? `, about ${Math.round(ratio)}× smaller` : ratio >= 1.5 ? ", well behind the leader" : ""}.`;
  } else {
    const last = rows[rows.length - 1];
    lead = `${lead0.key} has the highest ${m.label.toLowerCase()} at ${fmt(lead0[p.metric], m.fmt)}; ${last.key} has the lowest at ${fmt(last[p.metric], m.fmt)}.`;
  }
  // story hook: West EV stock
  if (p.filters.fuel_type && p.filters.fuel_type.includes("Electric") && p.dim === "region") {
    const w = rows.find(r => r.key === "West");
    if (w) lead += ` West is also where EV stock is thinnest: ${w.stock} units on hand against ${w.units} sold.`;
  }

  const cols = [{ key: "key", label: dimLabel }];
  const order = [p.metric, ...["revenue", "units", "profit", "margin"].filter(x => x !== p.metric)].slice(0, 4);
  for (const k of order) cols.push({ key: k, label: METRICS[k].label, num: true, fmt: METRICS[k].fmt, primary: k === p.metric });

  const title = `${m.label} by ${dimLabel.toLowerCase()}${scope ? " · " + scope : ""}`;
  return {
    kind: "answer", parsed: p, title: capital(title), lead, sql: buildSql(p),
    bullets: rows.slice(0, 5).map(r => `${r.key}: ${fmt(r[p.metric], m.fmt)}`),
    columns: cols, rows,
    chart: { key: p.metric, fmt: m.fmt, label: m.label },
    assumptions: assumptionsFor(p, filtered.length),
    related: relatedFor(p, rows),
  };
}

function buildSql(p) {
  const m = METRICS[p.metric || "revenue"];
  const dim = p.dim || "region";
  const others = ["revenue", "units", "profit"].filter(k => k !== p.metric).slice(0, 2)
    .map(k => `       ${METRICS[k].sql} AS ${k}`).join(",\n");
  return `-- Compiled by the Northline Sales semantic layer
SELECT ${dim},
       ${m.sql} AS ${p.metric || "revenue"},
${others}
FROM cars${sqlWhere(p.filters)}
GROUP BY ${dim}
ORDER BY ${p.metric || "revenue"} DESC${p.top ? "\nLIMIT " + p.top : ""};`;
}

function assumptionsFor(p, n) {
  const a = [`Based on ${n} of 60 rows in cars.`];
  if (p.followUp) a.push("Kept the filters and grouping from your previous question.");
  if (!p.edited && p.raw && /\bsales\b/i.test(p.raw) && p.metric === "revenue") a.push("I read “sales” as revenue. If you meant units, change the metric chip above.");
  if (p.edited) a.push("You edited this query directly, so it ran without re-reading your question.");
  return a;
}

function relatedFor(p, rows) {
  const out = [];
  const top = rows[0] && rows[0].key;
  if (p.dim === "region" && top) out.push(`Which models drive revenue in the ${top}?`);
  if (p.dim !== "fuel_type" && !p.filters.fuel_type) out.push(`Break ${METRICS[p.metric].label.toLowerCase()} down by fuel type`);
  if (p.dim !== "region") out.push(`Now only the West`);
  if (p.metric !== "margin") out.push(`What's the gross margin by ${p.dim === "region" ? "make" : p.dim.replace("_", " ")}?`);
  out.push("Which cars are running low on stock?");
  if (p.dim !== "color") out.push("Which colors sell best?");
  out.push("Which region has the highest units sold?", "Top 5 models by gross margin", "What's the average selling price by make?");
  return [...new Set(out)].slice(0, 6);
}

function noDataReason(filters, data) {
  if (filters.fuel_type && filters.region) {
    const where = [...new Set(data.filter(r => filters.fuel_type.includes(r.fuel_type)).map(r => r.region))];
    if (where.length) return `${filters.fuel_type.join(" / ")} vehicles are only sold in the ${where.join(" and ")} in this dataset.`;
  }
  return "The filters you combined don't match any rows.";
}
function emptyAlternatives(p) {
  const out = [];
  if (p.filters.region) {
    const f = Object.assign({}, p.filters); delete f.region;
    out.push({ label: `Show ${describeFilters(f) || "all"} cars across all regions`, q: `Compare ${METRICS[p.metric || "revenue"].label.toLowerCase()} of ${describeFilters(f) || "all"} cars by region` });
  }
  out.push({ label: "Revenue by fuel type", q: "What is the total revenue by fuel type?" });
  return out;
}
function rewrite(q, metric) {
  if (/region/i.test(q)) return `Which region has the highest ${metric}?`;
  if (/model|car/i.test(q)) return `Top 5 models by ${metric}`;
  return `Top 5 models by ${metric}`;
}
function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  return [ref, pulse];
}

function NotePop({ n, title, children, onClose, onGo, anchor }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const place = () => {
    const at = anchor && anchor.current, el = ref.current;
    if (!at || !el || !at.getBoundingClientRect) return;
    const r = at.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight, vw = window.innerWidth, vh = window.innerHeight, m = 12;
    const left = Math.max(m, Math.min(r.left + r.width / 2 - w / 2, vw - w - m));
    let top = r.bottom + 8;
    if (top + h > vh - m && r.top - 8 - h > m) top = r.top - 8 - h;
    setPos({ left, top: Math.max(m, top) });
  };
  React.useLayoutEffect(place, []);
  useEffect(() => {
    const f = () => place();
    window.addEventListener("resize", f); window.addEventListener("scroll", f, true);
    return () => { window.removeEventListener("resize", f); window.removeEventListener("scroll", f, true); };
  }, []);
  const node = html`<span ref=${ref} className="hs-pop" role="dialog" aria-label=${"Design decision " + n}
      style=${pos ? { left: pos.left + "px", top: pos.top + "px" } : { left: "0px", top: "0px", visibility: "hidden" }}>
    <span className="hs-pop-top"><span className="hs-eyebrow">Design decision ${n} of ${NOTE_TOTAL}</span>
      <span className="hs-nav">
        <button type="button" className="hs-btn" onClick=${() => onGo(+n - 1)} disabled=${+n <= 1} aria-label="Previous design decision" title="Previous (←)"><${Icon} n="chevL" s=${14} /></button>
        <button type="button" className="hs-btn" onClick=${() => onGo(+n + 1)} disabled=${+n >= NOTE_TOTAL} aria-label="Next design decision" title="Next (→)"><${Icon} n="chev" s=${14} /></button>
        <span className="hs-sep"></span>
        <button type="button" className="hs-btn" onClick=${onClose} aria-label="Close"><${Icon} n="x" s=${14} /></button>
      </span></span>
    <strong className="hs-title">${title}</strong>
    <span className="hs-body">${children}</span>
  </span>`;
  return typeof ReactDOM !== "undefined" && ReactDOM.createPortal && typeof document !== "undefined" && document.body ? ReactDOM.createPortal(node, document.body) : node;
}

/* Matrix loader: 7×7 LED grid, rotating comet spinner, 12 frames @ 12fps (after ElevenLabs UI "Matrix" loader preset) */
const MATRIX_N = 7, MATRIX_FRAMES = 12;
const LOADER_FRAMES = (() => {
  const c = (MATRIX_N - 1) / 2, frames = [];
  for (let f = 0; f < MATRIX_FRAMES; f++) {
    const head = (f / MATRIX_FRAMES) * Math.PI * 2;
    const fr = [];
    for (let r = 0; r < MATRIX_N; r++) {
      const row = [];
      for (let col = 0; col < MATRIX_N; col++) {
        const dx = col - c, dy = r - c, d = Math.hypot(dx, dy);
        if (d < 1.9 || d > 3.3) { row.push(0); continue; }
        let behind = head - Math.atan2(dy, dx);
        behind = ((behind % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const tail = Math.PI * 1.1;
        row.push(behind < tail ? Math.pow(1 - behind / tail, 1.6) : 0);
      }
      fr.push(row);
    }
    frames.push(fr);
  }
  return frames;
})();

/* Ripple: rings expand from the centre dot and fade as they reach the edge, 16 frames */
const RIPPLE_FRAMES = (() => {
  const c = (MATRIX_N - 1) / 2, maxR = Math.hypot(c, c), count = 16, frames = [];
  for (let f = 0; f < count; f++) {
    const fr = [];
    for (let r = 0; r < MATRIX_N; r++) {
      const row = [];
      for (let col = 0; col < MATRIX_N; col++) {
        const d = Math.hypot(col - c, r - c);
        let b = 0;
        for (const offset of [0, 0.5]) { // two rings in flight, half a cycle apart
          const radius = ((f / count + offset) % 1) * (maxR + 1);
          const band = Math.max(0, 1 - Math.abs(d - radius) / 0.9);
          const fade = 1 - Math.min(1, radius / (maxR + 1));
          b = Math.max(b, band * (0.25 + 0.75 * fade));
        }
        row.push(b);
      }
      fr.push(row);
    }
    frames.push(fr);
  }
  return frames;
})();

function Matrix({ frames = RIPPLE_FRAMES, fps = 14, size = 3, gap = 1.5, label = "Loading" }) {
  const [f, setF] = useState(0);
  useEffect(() => {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const t = setInterval(() => setF(x => (x + 1) % frames.length), 1000 / fps);
    return () => clearInterval(t);
  }, [frames, fps]);
  const n = frames[0].length, w = n * size + (n - 1) * gap;
  const cells = [];
  frames[f].forEach((row, r) => row.forEach((b, c) => cells.push(html`<circle key=${r + "-" + c} cx=${c * (size + gap) + size / 2} cy=${r * (size + gap) + size / 2} r=${size / 2} className="mx-off" /><circle key=${"o" + r + "-" + c} cx=${c * (size + gap) + size / 2} cy=${r * (size + gap) + size / 2} r=${size / 2} className="mx-on" style=${{ opacity: b }} />`)));
  return html`<svg className="matrix" width=${w} height=${w} viewBox=${`0 0 ${w} ${w}`} role="img" aria-label=${label}>${cells}</svg>`;
}

const SEM = ENGINE.SEMANTIC;

const FILTER_DIMS = ["region", "fuel_type", "make", "model", "color"];

function toDraft(p) {
  const low = p.intent === "lowstock";
  const filters = {};
  Object.entries(p.filters || {}).forEach(([k, v]) => { filters[k] = [...v]; });
  return { metric: low ? "cover" : p.metric, dim: low ? null : p.dim, filters, top: p.top || (low ? 8 : null) };
}
function draftToParsed(d, base) {
  const low = d.metric === "cover";
  return { ...base, intent: low ? "lowstock" : "aggregate", metric: low ? null : d.metric, dim: low ? null : (d.dim || "model"),
    filters: d.filters, top: d.top || null, edited: true, followUp: false };
}
const dimLabel = k => SEM.dimensions[k] ? SEM.dimensions[k].label : k;
const topLabel = (t, low) => t ? (low ? `Lowest ${t}` : `Top ${t}`) : "All rows";
function diffDraft(a, b) {
  const out = [];
  if (a.metric !== b.metric) out.push(`Metric → ${SEM.measures[b.metric].label}`);
  if (b.metric !== "cover" && a.dim !== b.dim) out.push(`Breakdown → ${dimLabel(b.dim || "model")}`);
  const keys = new Set([...Object.keys(a.filters), ...Object.keys(b.filters)]);
  keys.forEach(k => {
    const x = (a.filters[k] || []).join("/"), y = (b.filters[k] || []).join("/");
    if (x === y) return;
    if (!x) out.push(`Added ${dimLabel(k)} is ${y}`);
    else if (!y) out.push(`Removed ${dimLabel(k)} filter`);
    else out.push(`${dimLabel(k)} → ${y}`);
  });
  if ((a.top || null) !== (b.top || null)) out.push(`Rows → ${topLabel(b.top, b.metric === "cover")}`);
  return out;
}

function MetricDef({ k }) {

  const m = SEM.measures[d.metric];

  return html`<div className="qchips-box" ref=${box}>
    <div className="qsentence">
      <span className="qwrap" onMouseEnter=${() => { clearTimeout(hoverT.current); hoverT.current = setTimeout(() => setHover(true), 180); }}

        ${chip("metric", html`${m.certified && html`<span className="seal" title="Certified by the data team"><${Icon} n="check" s=${10} /></span>`}${m.label}`, { cls: "metric" + (changed.metric ? " changed" : "") })}

              sub=${SEM.measures[k].certified ? "Certified" : "Not certified"}>${SEM.measures[k].label}<//>`)}
          <//>`
        : hover && html`<${Pop} wide><${MetricDef} k=${d.metric} /><//>`}

/* ---------- charts: type picker + recommended default ---------- */
const CHART_TYPES = [
  { key: "bar", label: "Bar", icon: "M4 20h16M7 20v-7M12 20V6M17 20v-10" },
  { key: "line", label: "Line", icon: "M3 17l5-6 4 3 8-9" },
  { key: "area", label: "Area", icon: "M3 17l5-6 4 3 8-9V20H3z" },
  { key: "doughnut", label: "Doughnut", icon: "M12 3a9 9 0 1 0 9 9M12 3v5a4 4 0 1 1-4 4H3" },
  { key: "radar", label: "Radar", icon: "M12 3l8.5 6.2-3.2 9.8H6.7L3.5 9.2zM12 9l3 2.2-1.1 3.5h-3.8L9 11.2z" },
];
const ADDITIVE = ["revenue", "units", "profit", "stock"];
const SHARE_WORDS = /\b(share|mix|split|proportion|composition|contribut\w*|breakdown|percent(age)? of)\b|\bbreak\s+(\w+\s+){0,3}down\b/i;

function chartFacts(result) {
  const c = result.chart, p = result.parsed || {};
  const n = Math.min(result.rows.length, 10);
  const dim = c.lowIsBad ? "vehicle lines" : (ENGINE.SEMANTIC.dimensions[p.dim] ? ENGINE.SEMANTIC.dimensions[p.dim].label.toLowerCase() + (n === 1 ? "" : "s") : "groups");
  const metric = p.intent === "lowstock" ? "cover" : p.metric;
  return { n, dim, metric, additive: ADDITIVE.includes(metric), share: SHARE_WORDS.test(p.raw || ""), label: c.label };
}
function recommendChart(result) {
  const f = chartFacts(result);
  if (f.additive && f.share && f.n >= 2 && f.n <= 6)
    return { key: "doughnut", why: `You asked how the total splits, and there are only ${f.n} parts, so a doughnut shows each one's share at a glance.` };
  return { key: "bar", why: `Ranking ${f.n} ${f.dim} by ${f.label.toLowerCase()}: bar lengths on one baseline are the easiest to compare.` };
}
function chartAvailability(result, key) {
  const f = chartFacts(result);
  if (key === "doughnut" && !f.additive) return { disabled: true, note: `${f.label} doesn't add up to a whole` };
  if (key === "doughnut" && f.n < 2) return { disabled: true, note: "Needs at least 2 parts" };
  if (key === "radar" && f.n < 3) return { disabled: true, note: "Needs at least 3 categories" };
  if ((key === "line" || key === "area") && f.n < 2) return { disabled: true, note: "Needs at least 2 points" };
  if (key === "line" || key === "area") return { note: "Best for trends over time" };
  if (key === "radar") return { note: "Best for comparing profile shapes" };
  if (key === "doughnut") return { note: "Best for share of a whole" };
  return { note: "Best for ranking and comparing" };
}
const CHART_CAVEAT = {
  line: "These categories have no time order, so the slope between points doesn't mean anything. Read the dots, not the line.",
  area: "These categories have no time order, so the filled shape suggests a trend that isn't there.",
  doughnut: "Slices are compared by angle, which is less exact than bar length. Fine for share, weak for close values.",
  radar: "Spoke lengths are hard to compare across a circle. Use it to spot an uneven profile, not to rank.",
  bar: "Bars work for any ranking, but this question is about share of the whole.",
};

function axisFmt(v, kind) {
  if (kind === "usd") return v >= 1e6 ? "$" + +(v / 1e6).toFixed(v % 1e6 ? 1 : 0) + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + Math.round(v);
  if (kind === "pct") return Math.round(v * 100) + "%";
  if (kind === "weeks") return +v.toFixed(1) + " wks";
  return v >= 1e3 ? +(v / 1e3).toFixed(1) + "K" : String(Math.round(v));
}
function niceTicks(max, count = 4) {
  if (max <= 0) return [0];
  const raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const ticks = []; for (let t = 0; t <= max + step * 0.001; t += step) ticks.push(t);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}
const clip = (s, n) => (s = String(s), s.length > n ? s.slice(0, n - 1) + "…" : s);

function ChartTypeMenu({ value, rec, result, onChange }) {
  const [open, setOpen] = useState(false);
  const box = useRef(null);
  useEffect(() => {
    if (!open) return;
    const down = e => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    const key = e => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", down); window.addEventListener("keydown", key);
    return () => { document.removeEventListener("mousedown", down); window.removeEventListener("keydown", key); };
  }, [open]);
  const cur = CHART_TYPES.find(t => t.key === value);
  const ico = d => html`<svg className="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d=${d} /></svg>`;
  return html`<div className="ct-menu" ref=${box}>
    <button type="button" className=${"ct-btn" + (open ? " open" : "")} onClick=${() => setOpen(!open)} aria-haspopup="listbox" aria-expanded=${open} aria-label=${"Chart type: " + cur.label}>
      ${ico(cur.icon)}<span>${cur.label}</span>${value === rec && html`<span className="ct-rec-dot" title="Recommended"></span>`}<${Icon} n="caret" s=${14} />
    </button>
    ${open && html`<div className="pop ct-pop" role="listbox" aria-label="Chart type">
      <div className="pop-h">Chart type</div>
      ${CHART_TYPES.map(t => { const a = chartAvailability(result, t.key); return html`<button type="button" key=${t.key} role="option" aria-selected=${value === t.key}
          className=${"opt ct-opt" + (value === t.key ? " on" : "")} disabled=${a.disabled} onClick=${() => { onChange(t.key); setOpen(false); }}>
          <span className="ct-ico">${ico(t.icon)}</span>
          <span className="opt-main"><span className="ct-name">${t.label}${t.key === rec && html`<span className="ct-rec">Recommended</span>`}</span><span className="opt-sub">${a.note}</span></span>
          ${value === t.key && html`<${Icon} n="check" s=${14} />`}
        </button>`; })}
    </div>`}
  </div>`;
}

function ChartPanel({ result, type, setType }) {
  const rec = useMemo(() => recommendChart(result), [result]);
  const chosen = type && !chartAvailability(result, type).disabled ? type : rec.key;
  const { label, fmt } = result.chart;

    <div className="chart-head">
      <div className="chart-title"><span>${label}</span>${result.rows.length > 10 && html`<span className="muted">Top 10 of ${result.rows.length}</span>`}</div>

    </div>
    ${chosen === "bar" && html`<${BarChart} result=${result} />`}

    ${chosen === "doughnut" && html`<${DoughnutChart} result=${result} />`}
    ${chosen === "radar" && html`<${RadarChart} result=${result} />`}
    <p className=${"chart-note" + (chosen === rec.key ? "" : " warn")}>${chosen === rec.key
      ? html`<span className="ct-rec">Recommended</span> ${rec.why}`
      : html`${CHART_CAVEAT[chosen]} <button type="button" className="link-btn" onClick=${() => setType(rec.key)}>Back to ${CHART_TYPES.find(t => t.key === rec.key).label.toLowerCase()}</button>`}</p>
  </div>`;
}

function BarChart({ result }) {
  const { key, fmt, lowIsBad } = result.chart;
  const rows = result.rows.slice(0, 10);
  const max = Math.max(...rows.map(r => r[key]), 0.0001);
  const nameKey = result.columns[0].key;
  return html`<div className="bars" role="img" aria-label=${result.chart.label + " bar chart"}>${rows.map((r, i) => {
    const pct = Math.max(1.5, (r[key] / max) * 100), bad = lowIsBad && r[key] < 2;
    return html`<div className="bar-row" key=${i}>
      <div className="bar-label" title=${r[nameKey]}>${r[nameKey]}</div>
      <div className="bar-track"><div className=${"bar" + (bad ? " bar-bad" : "") + (i === 0 && !lowIsBad ? " bar-lead" : "")} style=${{ width: pct + "%", animationDelay: i * 40 + "ms" }}></div></div>
      <div className="bar-val">${ENGINE.fmt(r[key], fmt)}</div>
    </div>`; })}</div>`;
}

function Tip({ x, name, value, w }) {
  const left = Math.min(Math.max(x, 70), w - 70);
  return html`<div className="ch-tip" style=${{ left: (left / w * 100) + "%" }}><strong>${value}</strong><span>${name}</span></div>`;
}

function LineChart({ result, area }) {
  const { key, fmt } = result.chart;
  const rows = result.rows.slice(0, 10), nameKey = result.columns[0].key;
  const [hi, setHi] = useState(null);
  const W = 640, H = 300, L = 76, R = 20, T = 16, B = 86;
  const ticks = niceTicks(Math.max(...rows.map(r => r[key]))), top = ticks[ticks.length - 1] || 1;
  const x = i => rows.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (rows.length - 1);
  const y = v => T + (1 - v / top) * (H - T - B);
  const pts = rows.map((r, i) => [x(i), y(r[key])]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const band = (W - L - R) / Math.max(rows.length - 1, 1);
  return html`<div className="ch-wrap" onMouseLeave=${() => setHi(null)}>
    <svg viewBox=${`0 0 ${W} ${H}`} className="ch-svg" role="img" aria-label=${result.chart.label + (area ? " area chart" : " line chart")}>
      ${ticks.map(t => html`<g key=${t}><line x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} className="ch-grid" /><text x=${L - 8} y=${y(t) + 4} className="ch-axis" textAnchor="end">${axisFmt(t, fmt)}</text></g>`)}
      ${area && html`<path d=${line + ` L${x(rows.length - 1)} ${y(0)} L${x(0)} ${y(0)} Z`} className="ch-area" />`}
      <path d=${line} className="ch-line" />
      ${hi != null && html`<line x1=${pts[hi][0]} x2=${pts[hi][0]} y1=${T} y2=${H - B} className="ch-cross" />`}
      ${pts.map((p, i) => html`<circle key=${i} cx=${p[0]} cy=${p[1]} r=${hi === i ? 6 : 4.5} className="ch-dot" />`)}
      ${rows.map((r, i) => html`<text key=${"l" + i} className="ch-axis" textAnchor="end" transform=${`translate(${x(i) + 4},${H - B + 16}) rotate(-40)`}>${clip(r[nameKey], 14)}</text>`)}
      ${rows.map((r, i) => html`<rect key=${"h" + i} x=${x(i) - band / 2} y=${T} width=${band} height=${H - T - B} className="ch-hit" tabIndex="0"
        onMouseEnter=${() => setHi(i)} onFocus=${() => setHi(i)} onBlur=${() => setHi(null)} />`)}
    </svg>
    ${hi != null && html`<${Tip} x=${pts[hi][0]} w=${W} name=${rows[hi][nameKey]} value=${ENGINE.fmt(rows[hi][key], fmt)} />`}
  </div>`;
}

function DoughnutChart({ result }) {
  const { key, fmt, label } = result.chart;
  const nameKey = result.columns[0].key;
  const [hi, setHi] = useState(null);
  const sorted = [...result.rows].sort((a, b) => b[key] - a[key]);
  let parts = sorted.slice(0, 6).map((r, i) => ({ name: r[nameKey], v: r[key], c: "cat-" + (i + 1) }));
  if (sorted.length > 6) parts.push({ name: `Other (${sorted.length - 6})`, v: sorted.slice(6).reduce((s, r) => s + r[key], 0), c: "cat-other" });
  const total = parts.reduce((s, p) => s + p.v, 0) || 1;
  const S = 220, cx = S / 2, R = 92, r = 62, gap = 0.012;
  let a0 = -Math.PI / 2;
  const arcs = parts.map(p => {
    const sweep = (p.v / total) * Math.PI * 2, s = a0 + (parts.length > 1 ? gap : 0), e = a0 + sweep - (parts.length > 1 ? gap : 0);
    a0 += sweep;
    const big = e - s > Math.PI ? 1 : 0, P = (rad, a) => [cx + rad * Math.cos(a), cx + rad * Math.sin(a)];
    const [x1, y1] = P(R, s), [x2, y2] = P(R, e), [x3, y3] = P(r, e), [x4, y4] = P(r, s);
    const d = parts.length === 1 ? `M${cx} ${cx - R}A${R} ${R} 0 1 1 ${cx - 0.01} ${cx - R}L${cx - 0.01} ${cx - r}A${r} ${r} 0 1 0 ${cx} ${cx - r}Z`
      : `M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z`;
    return { ...p, d, share: p.v / total };
  });
  const h = hi != null ? arcs[hi] : null;
  return html`<div className="dn-wrap">
    <svg viewBox=${`0 0 ${S} ${S}`} className="dn-svg" role="img" aria-label=${label + " doughnut chart"} onMouseLeave=${() => setHi(null)}>
      ${arcs.map((a, i) => html`<path key=${i} d=${a.d} className=${"dn-seg " + a.c + (hi != null && hi !== i ? " dim" : "")} tabIndex="0"
        onMouseEnter=${() => setHi(i)} onFocus=${() => setHi(i)} onBlur=${() => setHi(null)}><title>${a.name}: ${ENGINE.fmt(a.v, fmt)} (${Math.round(a.share * 100)}%)</title></path>`)}
      <text x=${cx} y=${cx - 4} className="dn-val" textAnchor="middle">${h ? Math.round(h.share * 100) + "%" : ENGINE.fmt(total, fmt)}</text>
      <text x=${cx} y=${cx + 16} className="dn-sub" textAnchor="middle">${h ? clip(h.name, 18) : "Total " + label.toLowerCase()}</text>
    </svg>
    <ul className="dn-legend">${arcs.map((a, i) => html`<li key=${i} className=${hi === i ? "on" : ""} onMouseEnter=${() => setHi(i)} onMouseLeave=${() => setHi(null)}>
      <span className=${"dn-sw " + a.c}></span><span className="dn-name" title=${a.name}>${a.name}</span><span className="dn-num">${ENGINE.fmt(a.v, fmt)}</span><span className="dn-pct">${Math.round(a.share * 100)}%</span></li>`)}</ul>
  </div>`;
}

function RadarChart({ result }) {
  const { key, fmt, label } = result.chart;
  const rows = result.rows.slice(0, 10), nameKey = result.columns[0].key;
  const [hi, setHi] = useState(null);
  const W = 460, H = 330, cx = W / 2, cy = H / 2 + 4, R = 112;
  const max = Math.max(...rows.map(r => r[key])) || 1;
  const ang = i => -Math.PI / 2 + (i * Math.PI * 2) / rows.length;
  const P = (rad, i) => [cx + rad * Math.cos(ang(i)), cy + rad * Math.sin(ang(i))];
  const pts = rows.map((r, i) => P((r[key] / max) * R, i));
  const ring = f => rows.map((_, i) => P(R * f, i).map(n => n.toFixed(1)).join(",")).join(" ");
  return html`<div className="ch-wrap" onMouseLeave=${() => setHi(null)}>
    <svg viewBox=${`0 0 ${W} ${H}`} className="ch-svg radar" role="img" aria-label=${label + " radar chart"}>
      ${[0.25, 0.5, 0.75, 1].map(f => html`<polygon key=${f} points=${ring(f)} className="ch-grid" fill="none" />`)}
      ${rows.map((_, i) => { const [x2, y2] = P(R, i); return html`<line key=${"s" + i} x1=${cx} y1=${cy} x2=${x2} y2=${y2} className="ch-grid" />`; })}
      <polygon points=${pts.map(p => p.join(",")).join(" ")} className="ch-area" />
      <polygon points=${pts.map(p => p.join(",")).join(" ")} className="ch-line" />
      ${pts.map((p, i) => html`<circle key=${"d" + i} cx=${p[0]} cy=${p[1]} r=${hi === i ? 6 : 4.5} className="ch-dot" tabIndex="0"
        onMouseEnter=${() => setHi(i)} onFocus=${() => setHi(i)} onBlur=${() => setHi(null)}><title>${rows[i][nameKey]}: ${ENGINE.fmt(rows[i][key], fmt)}</title></circle>`)}
      ${rows.map((r, i) => { const c = Math.cos(ang(i)), [x, y] = P(R + (Math.abs(c) < 0.2 ? 20 : 14), i);
        return html`<text key=${"t" + i} x=${x} y=${y + 4} className=${"ch-axis" + (hi === i ? " hi" : "")} textAnchor=${Math.abs(c) < 0.2 ? "middle" : c > 0 ? "start" : "end"}>${clip(r[nameKey], 14)}</text>`; })}
      <text x=${cx + 6} y=${cy - R * 0.75 + 4} className="ch-axis faint">${axisFmt(max * 0.75, fmt)}</text>
    </svg>
    ${hi != null && html`<div className="ch-tip static"><strong>${ENGINE.fmt(rows[hi][key], fmt)}</strong><span>${rows[hi][nameKey]}</span></div>`}
  </div>`;
}

function AnswerCard({ msg, onAsk, onRetry, onFlag, onRerun, notesFirst, howToken }) {
  const r = msg.result;
  const [tab, setTab] = useState(r.rows.length > 1 ? "Table" : "Table");

  const segRef = useRef(null);
  const [csv, setCsv] = useState(false);
  const [chartType, setChartType] = useState(null);
  const streaming = msg.status === "streaming";
  const [roll, setRoll] = useState(0);
  const shown = streaming ? r.lead.slice(0, msg.chars) : r.lead;
  const pool = r.related;
  const related = pool.length > 3 ? [0, 1, 2].map(i => pool[(roll * 3 + i) % pool.length]) : pool;
  return html`<div className="ans-wrap"><article className="card answer">

      ${!streaming && r.bullets && r.bullets.length > 1 && html`<ul className="bullets">${r.bullets.slice(0, 4).map((b, i) => html`<li key=${i}>${b}</li>`)}</ul>`}
    </div>
    ${!streaming && html`<div className="reveal">
      <div className="seg-row" ref=${segRef}>
        <div className="seg" role="tablist">${["Table", "Chart", "SQL"].map(t => html`<button key=${t} role="tab" aria-selected=${tab === t} className=${tab === t ? "on" : ""} onClick=${() => setTab(t)}>${t}</button>`)}</div>${notesFirst && html`<${Note} n="4" title="Compiled SQL is one tap away">The assistant never writes SQL. It queries the semantic layer, which compiles SQL from certified definitions. Analysts still want to audit that, so the compiled SQL sits beside Table and Chart rather than in a debug drawer.<//>`}
      </div>
      ${tab === "Table" && html`<${ResultTable} result=${r} />`}
      ${tab === "Chart" && html`<${ChartPanel} result=${r} type=${chartType} setType=${setChartType} />`}
      ${tab === "SQL" && html`<${Sql} sql=${r.sql} />`}
      <div className="actions">
        <button className="ghost-btn" onClick=${async () => { await copyText(toCsv(r.columns, r.rows)); setCsv(true); setTimeout(() => setCsv(false), 1500); }}><${Icon} n=${csv ? "check" : "copy"} s=${12} />${csv ? "Copied" : "Copy as CSV"}</button>
        <button className=${"ghost-btn" + (how ? " active" : "")} onClick=${() => setHow(!how)} aria-expanded=${how}><${Icon} n="info" s=${12} />How I got this</button>
        <span className="spacer"></span>
        <button className=${"icon-btn" + (msg.flagged ? " flagged" : "")} onClick=${onFlag} aria-label="Flag this answer" title=${msg.flagged ? "Flagged for review" : "Flag for review"}><${Icon} n="flag" s=${12} /></button>
        <button className="icon-btn" onClick=${onRetry} aria-label="Run again" title="Run again"><${Icon} n="retry" s=${12} /></button>
      </div>
      ${how && html`<div className="how">
        <div className="how-sec">
          <span className="eyebrow">What I understood${notesFirst && html`<${Note} n="5" title="Three questions hide behind “is this right?”">Did it understand me? The chips answer that in five seconds. Is the metric defined the way I think? Hover the metric for its definition, owner and certification, which is where most real disagreements start. Is the SQL right? Only analysts ask that, so SQL keeps its own tab and a link at the bottom of this panel. Raw JSON never shows: it's an implementation detail.<//>`}</span>
          <${QueryChips} result=${r} data=${CARS} onRerun=${onRerun} note=${notesFirst && html`<${Note} n="6" title="Fix the chip, not the prompt">If the assistant picked the wrong breakdown or filter, users correct that chip and rerun instead of rephrasing and hoping. Editing the semantic query keeps governance intact; editing SQL directly would bypass the certified metric definitions.<//>`} />
        </div>
        ${r.assumptions.length > 0 && html`<div className="how-sec"><span className="eyebrow">Good to know</span><ul>${r.assumptions.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></div>`}
        <button type="button" className="sql-link" onClick=${() => { setTab("SQL"); setTimeout(() => segRef.current && segRef.current.scrollIntoView({ block: "nearest", behavior: "smooth" }), 0); }}><${Icon} n="code" s=${14} />For analysts: see the SQL the semantic layer compiled<${Icon} n="chev" s=${12} /></button>
      </div>`}
      <div className="related">
        <div className="related-h"><${Icon} n="list" s=${12} />Related${notesFirst && html`<${Note} n="7" title="Follow-ups keep context">Suggestions like “Now only the West” reuse the previous grouping and filters, so a conversation narrows down instead of starting over each time. Try one.<//>`}</div>
        ${related.map((q, i) => html`<button key=${q} className="related-q" onClick=${() => onAsk(q)}>${q}<${Icon} n="chev" s=${12} /></button>`)}
        ${pool.length > 3 && html`<button className="reroll" onClick=${() => setRoll(roll + 1)}><${Icon} n="dice" s=${16} />Re-roll suggestions</button>`}
      </div>
    </div>`}
  </article>
  <footer className="meta"><span>${msg.time}</span><span><${Icon} n="tree" s=${10} />Northline Sales</span><span><${Icon} n="gauge" s=${12} />${msg.tokens.toLocaleString()} tokens used</span>${msg.flagged && html`<span className="flag-meta">Flagged for review</span>`}</footer>
  </div>`;
}

function UserBubble({ msg, onEdit, busy }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(msg.text);
  if (editing) return html`<div className="u-row"><div className="bubble editing">
    <textarea id=${"edit-" + msg.id} value=${val} onChange=${e => setVal(e.target.value)} rows="2" autoFocus onKeyDown=${e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (val.trim()) { setEditing(false); onEdit(val.trim()); } } if (e.key === "Escape") setEditing(false); }}></textarea>
    <div className="edit-actions"><button className="ghost-btn" onClick=${() => { setEditing(false); setVal(msg.text); }}>Cancel</button><button className="primary-btn" disabled=${!val.trim()} onClick=${() => { setEditing(false); onEdit(val.trim()); }}>Update answer</button></div>
  </div></div>`;
  return html`<div className="u-row">
    ${!busy && html`<button className="icon-btn edit-btn" onClick=${() => { setVal(msg.text); setEditing(true); }} aria-label="Edit question" title="Edit question"><${Icon} n="edit" /></button>`}
    <div className="bubble">${msg.text}</div>
  </div>`;
}
