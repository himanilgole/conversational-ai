/* ---------- shell ---------- */
const NAV = ["Ingestion", "IDE", "Jobs", "Semantic layer", "BI", "Conversational AI"];
const NAV_BOTTOM = ["Architecture", "Utilization", "Team", "Settings", "Community", "Help"];
const NavItem = ({ label, on }) => html`<li><a href="#" onClick=${e => e.preventDefault()} className=${on ? "on" : ""} aria-current=${on ? "page" : null} title=${label} aria-label=${label}><${NavIcon} name=${label} /><span className="nav-label">${label}</span></a></li>`;
const HISTORY = [
  ["Today", ["Compare sales of electric variants across different regions", "Which cars are running low on stock?"]],
  ["Yesterday", ["What's the gross margin by make?", "Which colors sell best in the West?", "Top 5 models by revenue"]],
  ["Sep 29", ["How many Tesla cars did we sell by color?", "Revenue by fuel type in the Midwest", "Average selling price by model"]],
];

function App() {
  const [msgs, setMsgs] = useState(() => seedConversation());
  const [input, setInput] = useState("");
  const [notes, setNotes] = useState(false);
  const [navMin, setNavMin] = useState(() => { try { return localStorage.getItem("nav-collapsed") === "1"; } catch (e) { return false; } });
  const toggleNav = () => setNavMin(v => { try { localStorage.setItem("nav-collapsed", v ? "0" : "1"); } catch (e) {} return !v; });
  const [openNote, setOpenNote] = useState(null);
  const [howToken, setHowToken] = useState(0);
  const noteAnchor = useRef(null);
  useEffect(() => {
    if (!openNote) return;
    const down = e => { if (!e.target.closest || !e.target.closest(".hs, .hs-pop")) setOpenNote(null); };
    const key = e => {
      if (e.key === "Escape") setOpenNote(null);
      const typing = e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName);
      if (!typing && e.key === "ArrowRight" && +openNote < NOTE_TOTAL) { e.preventDefault(); goToDecision(+openNote + 1); }
      if (!typing && e.key === "ArrowLeft" && +openNote > 1) { e.preventDefault(); goToDecision(+openNote - 1); }
    };
    document.addEventListener("mousedown", down); window.addEventListener("keydown", key);
    return () => { document.removeEventListener("mousedown", down); window.removeEventListener("keydown", key); };
  }, [openNote]);
  const [dataOpen, setDataOpen] = useState(false);
  const [tab, setTab] = useState("My chats");
  const [activeChat, setActiveChat] = useState(HISTORY[0][1][0]);
  const [synced, setSynced] = useState("4 hours ago");
  const [listen, setListen] = useState(null);
  const [clock, setClock] = useState(0);
  const [fromVoice, setFromVoice] = useState(false);
  const [micLevel, pulseMic] = useLevel();
  const listenTimers = useRef([]);
  const voiceTurn = useRef(0);
  const textareaRef = useRef(null);
  const [appsOpen, setAppsOpen] = useState(true);
  const scroller = useRef(null);
  const busy = msgs.some(m => m.status === "thinking" || m.status === "streaming");

  useEffect(() => { const el = scroller.current; if (el) el.scrollTo({ top: el.scrollHeight, behavior: "smooth" }); }, [msgs.length, busy]);

  /* ----- decision tour: put the prototype into the state each decision lives in ----- */
  const TOUR_Q = { main: ENGINE.STARTERS[0], clarify: "Which models are doing best?", empty: "Show diesel trucks sold in the West" };
  const isDone = (m, kind) => m.role === "assistant" && m.result && m.result.kind === kind && m.status === "done";
  function doneTurn(q, list) {
    const result = ENGINE.run(q, CARS, lastParsed(list));
    return [{ id: uid(), role: "user", text: q }, { id: uid(), role: "assistant", status: "done", result, secs: 5, chars: result.lead ? result.lead.length : 0, time: nowLabel(), tokens: 1100 + Math.floor(Math.random() * 400) }];
  }
  function releaseHeld(list) { return list.map(m => m.held ? { ...m, held: false, status: "done", chars: m.result.lead ? m.result.lead.length : 0 } : m); }
  function tourState(n) {
    if (n === 1) return [];
    if (n === 2) {
      if (msgs.some(m => m.held)) return msgs;
      const q = msgs.length ? ENGINE.STARTERS[1] : TOUR_Q.main;
      const result = ENGINE.run(q, CARS, lastParsed(msgs));
      return [...msgs, { id: uid(), role: "user", text: q }, { id: uid(), role: "assistant", status: "thinking", stage: 1, held: true, result, secs: 5, chars: 0, time: nowLabel(), tokens: 1200 }];
    }
    let list = releaseHeld(msgs);
    if (n === 10) return list;
    if (!list.some(m => isDone(m, "answer"))) list = [...list, ...doneTurn(TOUR_Q.main, list)];
    if (n === 8 && !list.some(m => isDone(m, "clarify"))) list = [...list, ...doneTurn(TOUR_Q.clarify, list)];
    if (n === 9 && !list.some(m => isDone(m, "empty"))) list = [...list, ...doneTurn(TOUR_Q.empty, list)];
    return list;
  }
  const tourPending = useRef(null);
  useEffect(() => {
    if (openNote === "2" || tourPending.current === 2) return;
    if (msgs.some(m => m.held)) setMsgs(ms => releaseHeld(ms));
  }, [openNote, msgs]);
  function goToDecision(n) {
    if (n < 1 || n > NOTE_TOTAL) return;
    tourPending.current = n;
    cancelListening();
    setOpenNote(null);
    setMsgs(tourState(n));
    if (n === 5 || n === 6) setHowToken(t => t + 1);
    let tries = 0;
    const show = () => {
      const el = document.querySelector('[data-hs="' + n + '"]');
      if (!el && tries++ < 8) { setTimeout(show, 60); return; }
      if (el) el.scrollIntoView({ block: "center", behavior: "auto" });
      setOpenNote(String(n));
      tourPending.current = null;
    };
    setTimeout(show, 80);
  }

  function lastParsed(list) {
    for (let i = list.length - 1; i >= 0; i--) if (list[i].result && list[i].result.kind === "answer") return list[i].result.parsed;
    return null;
  }

  function ask(q, base, opts = {}) {
    if (!q.trim() || busy) return;
    const list = base || msgs;
    const prev = lastParsed(list);
    const aid = uid();
    const result = ENGINE.run(q, CARS, prev);
    const secs = 5;
    const next = [...list, { id: uid(), role: "user", text: q, voice: !!opts.voice }, { id: aid, role: "assistant", status: "thinking", stage: 0, result, secs, chars: 0, time: nowLabel(), tokens: 900 + Math.floor(Math.random() * 700) + (result.sql ? result.sql.length : 0) }];
    setMsgs(next);
    setInput("");
    setFromVoice(false);
    animate(aid, result);
  }

  function rerunAt(index, parsed, changes) {
    if (busy) return;
    const result = ENGINE.execute(parsed, CARS);
    const aid = uid();
    const msg = { id: aid, role: "assistant", status: "thinking", stage: 0, result, secs: 5, chars: 0, time: nowLabel(), edits: changes, openHow: true, tokens: 600 + Math.floor(Math.random() * 300) + (result.sql ? result.sql.length : 0) };
    setMsgs(ms => ms.map((m, i) => i === index ? msg : m));
    animate(aid, result);
  }

  function animate(aid, result) {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const upd = patch => setMsgs(ms => ms.map(m => m.id === aid ? { ...m, ...(typeof patch === "function" ? patch(m) : patch) } : m));
    const stages = result.kind === "answer" ? STAGES.length : 2;
    const THINK_MS = 5000, stepMs = reduce ? 50 : THINK_MS / stages;
    let s = 0;
    const tick = () => {
      s++;
      if (s < stages) { upd({ stage: s }); setTimeout(tick, stepMs); return; }
      if (result.kind !== "answer") { upd({ status: "done" }); return; }
      upd({ status: "streaming", chars: 0 });
      const total = result.lead.length;
      const step = () => upd(m => {
        const c = Math.min(total, m.chars + (reduce ? total : 4 + Math.floor(Math.random() * 5)));
        if (c < total) setTimeout(step, 22);
        return { chars: c, status: c >= total ? "done" : "streaming" };
      });
      step();
    };
    setTimeout(tick, stepMs);
  }

  /* ----- simulated dictation ----- */
  const VOICE_SCRIPT = ["Which models are driving revenue in the West?", "Show me cars that are running low on stock", "What does gross margin look like by make?", "How many Teslas did we sell by color?", "Break down revenue by fuel type in the Northeast"];
  function nextScript() {
    const asked = new Set(msgs.filter(m => m.role === "user").map(m => m.text.toLowerCase()));
    const last = [...msgs].reverse().find(m => m.result && m.result.kind === "answer");
    const pool = [...(last ? last.result.related.filter(q => !/^Now only|^Break .* down by/i.test(q)) : []), ...VOICE_SCRIPT];
    const fresh = pool.filter(q => !asked.has(q.toLowerCase()));
    const list = fresh.length ? fresh : VOICE_SCRIPT;
    return list[voiceTurn.current++ % list.length];
  }
  function clearListenTimers() { listenTimers.current.forEach(clearTimeout); listenTimers.current = []; }
  function startListening() {
    if (busy || listen) return;
    const words = nextScript().split(" ");
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setListen({ words, n: 0, prev: input, t0: Date.now() });
    let t = reduce ? 200 : 900;
    words.forEach((w, i) => {
      t += reduce ? 60 : 170 + Math.random() * 190 + (/[,?]$/.test(words[i - 1] || "") ? 250 : 0);
      listenTimers.current.push(setTimeout(() => { pulseMic(0.55, 1); setListen(l => l && { ...l, n: i + 1 }); }, t));
    });
    listenTimers.current.push(setTimeout(() => finishListening(true), t + (reduce ? 200 : 1000)));
  }
  function finishListening(auto) {
    clearListenTimers();
    setListen(l => {
      if (!l) return null;
      const n = auto ? l.words.length : l.n;
      if (n === 0) { setInput(l.prev); return null; }
      setInput(l.words.slice(0, n).join(" "));
      setFromVoice(true);
      setTimeout(() => { const el = textareaRef.current; if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0);
      return null;
    });
  }
  function cancelListening() { clearListenTimers(); setListen(l => { if (l) setInput(l.prev); return null; }); }
  useEffect(() => {
    if (!listen) return;
    const k = e => { if (e.key === "Escape") cancelListening(); if (e.key === "Enter") { e.preventDefault(); finishListening(false); } };
    const iv = setInterval(() => setClock(c => c + 1), 250);
    window.addEventListener("keydown", k);
    return () => { window.removeEventListener("keydown", k); clearInterval(iv); };
  }, [!!listen]);
  useEffect(() => clearListenTimers, []);


  function editAt(index, text) { ask(text, msgs.slice(0, index)); }
  function retryAt(index) { const u = msgs[index - 1]; ask(u.text, msgs.slice(0, index - 1)); }
  function flagAt(id) { setMsgs(ms => ms.map(m => m.id === id ? { ...m, flagged: !m.flagged } : m)); }
  function newChat() { cancelListening(); setMsgs([]); setActiveChat(null); }
  function openHistory(q) { cancelListening(); setActiveChat(q); setMsgs([]); setTimeout(() => ask(q, []), 0); }

  // which answer carries the numbered notes: the first finished answer
  const firstClarifyId = (msgs.find(m => isDone(m, "clarify")) || {}).id;
  const firstEmptyId = (msgs.find(m => isDone(m, "empty")) || {}).id;
  const firstAnswerId = (msgs.find(m => m.result && m.result.kind === "answer" && m.status !== "thinking") || {}).id;
  const flaggedQs = msgs.map((m, i) => m.flagged ? msgs[i - 1].text : null).filter(Boolean);

  return html`<${NotesCtx.Provider} value=${{ on: notes, openId: openNote, setOpenId: setOpenNote, goTo: goToDecision, anchorRef: noteAnchor }}>
  <div className="app">
    <nav className=${"nav" + (navMin ? " min" : "")} aria-label="Product">
      <div className="nav-top">
        <div className="brand"><${Logo} />
          <button type="button" className="nav-toggle" onClick=${toggleNav} aria-label=${navMin ? "Expand navigation" : "Collapse navigation"} title=${navMin ? "Expand navigation" : "Collapse navigation"} aria-expanded=${!navMin}><${Icon} n=${navMin ? "panelOpen" : "panelClose"} s=${18} /></button>
        </div>
        <button className="ws" title="Northline Motors"><span className="ws-av">NM</span><span className="ws-name">Northline Motors</span></button>
        <ul className="nav-list">${NAV.map(l => html`<${NavItem} key=${l} label=${l} on=${l === "Conversational AI"} />`)}</ul>
        <div className="nav-sep"></div>
        <button className="nav-group" onClick=${() => setAppsOpen(!appsOpen)} aria-expanded=${appsOpen}><${Icon} n="caret" s=${16} className=${appsOpen ? "flip" : ""} /><span className="nav-label">Data Apps</span></button>
        ${(appsOpen || navMin) && html`<ul className="nav-list"><${NavItem} label="Manage apps" /></ul>`}
      </div>
      <div className="nav-foot">
        <div className="nav-sep"></div>
        <a href="#" onClick=${e => e.preventDefault()} className="trial" title="5 days left in your trial"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="#475467" strokeWidth="3" /><circle cx="9" cy="9" r="7" fill="none" stroke="#9E77ED" strokeWidth="3" strokeDasharray="44" strokeDashoffset="26" transform="rotate(-90 9 9)" strokeLinecap="round" /></svg><span className="nav-label">5 days left</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9 12h6M12.5 9l3 3-3 3" /></svg></a>
        <ul className="nav-list">${NAV_BOTTOM.map(l => html`<${NavItem} key=${l} label=${l} />`)}</ul>
      </div>
    </nav>

    <div className="work">
      <header className="topbar">
        <div className="tabs" role="tablist">${["My chats", "Team chats", "Flagged chats"].map(t => html`<button key=${t} role="tab" aria-selected=${tab === t} className=${tab === t ? "on" : ""} onClick=${() => setTab(t)}>${t}</button>`)}</div>
        <div className="mobile-brand"><span className="brand sm"><${Logo} /></span><span className="hide-xs">Conversational AI</span></div>
        <div className="top-actions">
          <button className="icon-btn show-sm" onClick=${newChat} aria-label="New chat" title="New chat"><${Icon} n="plus" /></button>
          <button className="ghost-btn" onClick=${() => setDataOpen(true)}><${Icon} n="db" s=${15} /><span className="hide-sm">View data</span></button>
          <label className="switch"><input id="notes-toggle" type="checkbox" checked=${notes} onChange=${e => { setNotes(e.target.checked); setOpenNote(null); }} /><span className="track"><span className="knob"></span></span><span><span className="hide-sm">See design </span>decisions</span></label>
        </div>
      </header>

      <div className="body">
        <aside className="history" aria-label="Chat history">
          <button className="new-chat" onClick=${newChat}><${Icon} n="chat" s=${16} />New chat</button>
          ${tab === "My chats" && HISTORY.map(([g, qs]) => html`<div key=${g} className="h-group"><div className="h-label">${g}</div><div className="h-list">${qs.map(q => html`<button key=${q} className=${"h-item" + (activeChat === q ? " on" : "")} onClick=${() => openHistory(q)} title=${q}>${q}</button>`)}</div></div>`)}
          ${tab === "Team chats" && html`<div className="h-group"><div className="h-label">Shared by your team</div><div className="h-list">${["Q3 revenue by region for the board pack", "Rivian margin vs other EVs", "Diesel demand in the South"].map(q => html`<button key=${q} className="h-item" onClick=${() => openHistory(q)} title=${q}>${q}</button>`)}</div></div>`}
          ${tab === "Flagged chats" && html`<div className="h-group"><div className="h-label">Flagged for review</div><div className="h-list">${flaggedQs.length ? flaggedQs.map(q => html`<button key=${q} className="h-item" onClick=${() => openHistory(q)} title=${q}>${q}</button>`) : html`<p className="h-empty">Nothing flagged yet. Use the flag on any answer to send it to your data team for review.</p>`}</div></div>`}
        </aside>

        <main className="main">
          <div className="thread" ref=${scroller}>
            <div className="thread-in">
              ${msgs.length === 0 && html`<div className="welcome">
                <div className="welcome-ic"><${Icon} n="sparkle" s=${22} /></div>
                <h2>Ask anything about Northline's car sales<${Note} n="1" title="Starters teach the scope">Four starters cover the four behaviours worth seeing: a comparison, a proactive alert, an ambiguous ask and a no-data case. They show what the assistant can do without a tutorial.<//></h2>
                <p className="muted">Answers come from the <button className="link" onClick=${() => setDataOpen(true)}>cars table</button>: 60 vehicles across four US regions, Q3 2026.</p>
                <div className="starters">${ENGINE.STARTERS.map(q => html`<button key=${q} className="starter" onClick=${() => ask(q)}>${q}<${Icon} n="chev" s=${14} /></button>`)}</div>
              </div>`}
              ${msgs.map((m, i) => {
                if (m.role === "user") return html`<${UserBubble} key=${m.id} msg=${m} busy=${busy} onEdit=${t => editAt(i, t)} />`;
                if (m.status === "thinking") return html`<${Thinking} key=${m.id} stage=${m.stage} />`;
                const k = m.result.kind;
                if (k === "answer") return html`<${AnswerCard} key=${m.id} msg=${m} notesFirst=${m.id === firstAnswerId} howToken=${howToken} onAsk=${ask} onRetry=${() => retryAt(i)} onFlag=${() => flagAt(m.id)} onRerun=${(p, changes) => rerunAt(i, p, changes)} />`;
                if (k === "clarify") return html`<${ClarifyCard} key=${m.id} msg=${m} showNote=${m.id === firstClarifyId} onAsk=${ask} answered=${i < msgs.length - 1} />`;
                if (k === "empty") return html`<${EmptyCard} key=${m.id} msg=${m} showNote=${m.id === firstEmptyId} onAsk=${ask} />`;
                return html`<${UnknownCard} key=${m.id} msg=${m} onAsk=${ask} />`;
              })}
            </div>
          </div>

          <div className="composer-wrap">
            <form className=${"composer" + (listen ? " is-listening" : "")} onSubmit=${e => { e.preventDefault(); ask(input, undefined, { voice: fromVoice }); }}>
              <label htmlFor="q" className="sr">Ask a question</label>
              ${listen ? html`<div className="transcript" aria-live="polite">
                  ${listen.n === 0 ? html`<span className="ph">Go ahead, I'm listening…</span>` : html`<span>${listen.words.slice(0, Math.max(0, listen.n - 2)).join(" ")} </span><span className="interim">${listen.words.slice(Math.max(0, listen.n - 2), listen.n).join(" ")}</span>`}<span className="caret"></span>
                </div>`
                : html`<textarea id="q" ref=${textareaRef} rows="2" value=${input} placeholder="Ask about revenue, margin, stock… or tap the mic to speak" onChange=${e => { setInput(e.target.value); if (!e.target.value.trim()) setFromVoice(false); }} onKeyDown=${e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input, undefined, { voice: fromVoice }); } }}></textarea>`}
              <div className="composer-row">
                ${listen ? html`<div className="capsule" role="status" aria-label="Listening">
                    <${Orb} state="listening" volRef=${micLevel} size=${26} />
                    <span className="cap-label">Listening</span>
                    <span className="cap-time">${(() => { const s = Math.floor((Date.now() - listen.t0) / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); })()}</span>
                    <span className="cap-demo" title="Dictation is simulated in this prototype">Demo</span>
                  </div>`
                : null}
                <span className="spacer"></span>
                <${Note} n="10" title="Voice lands in the box, not straight into a query">Dictated questions appear in the text box for a quick check before they run, because a misheard “West” or number gives a confident wrong chart. In this prototype the transcript is scripted; production would stream the microphone to ElevenLabs Scribe through a server that issues short-lived tokens.<//>
                ${listen ? html`
                  <button type="button" className="icon-btn" onClick=${cancelListening} aria-label="Cancel dictation" title="Cancel (Esc)"><${Icon} n="x" s=${16} /></button>
                  <button type="button" className="send" onClick=${() => finishListening(false)} aria-label="Done speaking" title="Done (Enter)"><${Icon} n="check" s=${16} /></button>`
                : html`
                  ${fromVoice && input.trim() && html`<span className="voice-hint">Check the text, then send</span>`}
                  <button type="button" className="icon-btn mic" onClick=${startListening} disabled=${busy} aria-label="Ask with your voice" title="Voice mode"><${Icon} n="mic" s=${18} /></button>
                  <button type="submit" className="send" disabled=${!input.trim() || busy} aria-label="Send"><${Icon} n="arrowR" s=${16} /></button>`}
              </div>
            </form>
            <div className="disclaimer">
              <p>Remember to always double check responses as the model we use may occasionally make mistakes.</p>
              <p className="sync-row">Semantic layer repositories were last synced ${synced} <button className="sync" onClick=${() => setSynced("just now")} disabled=${synced === "just now"}>${synced === "just now" ? "Synced" : "Sync now"}</button></p>
            </div>
          </div>
        </main>
      </div>
    </div>
    ${dataOpen && html`<${DataModal} onClose=${() => setDataOpen(false)} />`}
  </div>
  <//>`;
}

function seedConversation() {
  const q = ENGINE.STARTERS[0];
  const result = ENGINE.run(q, CARS, null);
  return [
    { id: "u0", role: "user", text: q },
    { id: "a0", role: "assistant", status: "done", result, secs: 5, chars: result.lead.length, time: nowLabel(), tokens: 1247 },
  ];
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>

</body></html>
